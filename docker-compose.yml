services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Absent .env is fine: providers without keys are dropped, not fatal.
      - path: .env
        required: false
    environment:
      # Reach the host's ollama from inside the container. Ollama must be bound
      # to 0.0.0.0 (OLLAMA_HOST=0.0.0.0) for this to resolve, not just loopback.
      OLLAMA_API_BASE: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Same image, different entrypoint. Its own service rather than a background
  # task inside the gateway, so a deploy or a crash on either side does not take
  # the other down - which is the whole claim the queue is making.
  worker:
    build: .
    command: ["python", "-m", "gateway.worker"]
    ports:
      - "8001:8001"  # its own registry, scraped as a second Prometheus target
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_API_BASE: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      # The board itself, read straight from the repo. Editing it in the UI is
      # disabled in the provider config, so this file stays the source of truth.
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Straight onto the board, no login screen and no navigating to find it.
      # "docker compose up gives a working dashboard" is an acceptance criterion,
      # and landing on an empty home page does not meet it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
