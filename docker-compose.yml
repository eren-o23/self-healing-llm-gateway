services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Absent .env is fine: providers without keys are dropped, not fatal.
      - path: .env
        required: false
    environment:
      # Reach the host's ollama from inside the container. Ollama must be bound
      # to 0.0.0.0 (OLLAMA_HOST=0.0.0.0) for this to resolve, not just loopback.
      OLLAMA_API_BASE: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Straight onto the board for the phase 5 recording, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
