services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Absent .env is fine: providers without keys are dropped, not fatal.
      - path: .env
        required: false
    environment:
      # Reach the host's ollama from inside the container. Ollama must be bound
      # to 0.0.0.0 (OLLAMA_HOST=0.0.0.0) for this to resolve, not just loopback.
      OLLAMA_API_BASE: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
