# Provider ladder and request classes.
#
# A provider whose api_key_env is unset is dropped from every ladder at startup
# rather than crashing the service - see gateway/config.py. ollama has no
# api_key_env, so it is always available and acts as the floor of every ladder.

# latency_budget_ms is per provider on purpose. A single global budget would hold
# ollama's breaker permanently open - local CPU inference genuinely takes ~14s -
# and taking the floor out of every ladder is the one failure this design cannot
# recover from.
providers:
  anthropic:
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 30
    latency_budget_ms: 15000

  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    timeout_s: 30
    latency_budget_ms: 15000

  groq:
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    timeout_s: 30
    latency_budget_ms: 5000  # normally ~150ms; anything near a second is already sick

  ollama:
    model: ollama/llama3.2
    api_base_env: OLLAMA_API_BASE
    api_base_default: http://localhost:11434
    timeout_s: 120  # local inference on CPU is slow; do not confuse that with a sick provider
    latency_budget_ms: 60000  # ~14s is this provider's healthy baseline, not a symptom

# Preference lists differ by class: a cheap classification call and a long form
# generation call should not fail over the same way.
classes:
  interactive.chat:
    ladder: [anthropic, openai, groq, ollama]
    deferrable: false

  # anthropic sits at rung 2 rather than ollama because this class hedges, and a
  # hedge partner that takes ~14s can never beat even a badly degraded groq - the
  # hedge would fire on every slow call and never once win.
  interactive.classify:
    ladder: [groq, anthropic, ollama]
    deferrable: false
    hedge_after_ms: 400

  batch.generate:
    ladder: [anthropic, openai, groq, ollama]
    deferrable: true

default_class: interactive.chat

# The sliding window each provider's success rate and percentiles are computed over.
# Shorter means the breaker reacts faster on thinner evidence.
health:
  window_s: 60

# When a provider is taken out of the ladder, and how it gets let back in.
breaker:
  error_threshold: 0.5
  min_samples: 8            # counted over health_samples, so bad input cannot reach it
  cooldown_s: 20
  cooldown_max_s: 120
  probe_ratio: 0.1
  probe_successes_required: 2

# Deferrable work: how often it is retried and how long results are kept.
# Delays are full-jittered - uniform over [0, min(base * 2**attempt, max)] - so a
# provider that just recovered is not stampeded by the whole backlog at once.
# The budget has to outlive a breaker cooldown. Full jitter halves each ceiling
# on average, so 8 attempts from a 2s base is roughly 90s of patience - comfortably
# past the 20s cooldown above, and still short enough to drain inside a recording.
# Attempts where every circuit was open do not count; see worker._defer.
queue:
  max_attempts: 8
  base_delay_s: 2
  max_delay_s: 60
  poll_interval_s: 1
  job_ttl_s: 86400
  idempotency_ttl_s: 86400
