# Provisioned in git so `docker compose up` yields a working datasource with no
# clicking. The dashboard beside it is provisioned the same way.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    # Pinned rather than generated, because every panel in gateway.json refers to
    # it by uid. Left to Grafana, the uid differs per volume and the whole board
    # comes up "Datasource not found".
    uid: prometheus
